name: Publish

# Runs when a v* tag is pushed. Publishes the tagged version to npm with
# trusted publishing (OIDC), then creates the GitHub Release from the
# matching CHANGELOG.md section. Every step can be re-run safely: a version
# that is already on npm is skipped, and an existing release is left alone.
# See docs/releasing.md.

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

      # Before publishing, so a missing CHANGELOG section stops the release
      # instead of leaving a published package without a GitHub Release.
      - name: Extract changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/extract-changelog-entry.ts "${TAG}" > release-notes.md

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate package
        run: |
          bun run typecheck
          bun run test
          bun run build
          npm pack --dry-run

      - name: Publish to npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on npm, skipping publish"
          else
            npm publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file release-notes.md
          fi
